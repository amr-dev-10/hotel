name: Backend CI/CD

on:
  push:
    branches:
      - develop
      - main
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:
    inputs:
      target:
        description: "Environment to deploy"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read
  id-token: write

concurrency:
  group: backend-deploy-${{ github.event_name == 'workflow_dispatch' && inputs.target || github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Test, migrate, and deploy backend
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && inputs.target || (github.ref_name == 'main' && 'production' || 'staging') }}
    env:
      ENVIRONMENT_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.target || (github.ref_name == 'main' && 'production' || 'staging') }}
      GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      ARTIFACT_REPOSITORY: ${{ vars.ARTIFACT_REPOSITORY || 'arcadia-repo' }}
      BACKEND_IMAGE_NAME: ${{ vars.BACKEND_IMAGE_NAME || 'backend-api' }}
      CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
      CLOUD_RUN_MIGRATION_JOB: ${{ vars.CLOUD_RUN_MIGRATION_JOB }}
      CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT: ${{ vars.CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT }}
      CLOUD_SQL_CONNECTION_NAME: ${{ vars.CLOUD_SQL_CONNECTION_NAME }}
      VPC_CONNECTOR: ${{ vars.VPC_CONNECTOR }}
      VPC_EGRESS: ${{ vars.VPC_EGRESS || 'private-ranges-only' }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      CORS_ORIGINS: ${{ vars.CORS_ORIGINS || '*' }}
      DEFAULT_TIMEZONE: ${{ vars.DEFAULT_TIMEZONE || 'UTC' }}
      WHATSAPP_DRY_RUN: ${{ vars.WHATSAPP_DRY_RUN || 'true' }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
      CELERY_BROKER_URL: ${{ secrets.CELERY_BROKER_URL || secrets.REDIS_URL }}
      CELERY_RESULT_BACKEND: ${{ secrets.CELERY_RESULT_BACKEND || secrets.REDIS_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
      VAULT_MASTER_KEY: ${{ secrets.VAULT_MASTER_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$ENVIRONMENT_NAME" == "production" && "$GITHUB_REF_NAME" != "main" ]]; then
            echo "Production deploys must run from the main branch."
            exit 1
          fi
          required=(
            GCP_PROJECT_ID
            GCP_WORKLOAD_IDENTITY_PROVIDER
            GCP_DEPLOY_SERVICE_ACCOUNT
            CLOUD_RUN_SERVICE
            CLOUD_RUN_MIGRATION_JOB
            CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT
            CLOUD_SQL_CONNECTION_NAME
            DATABASE_URL
            REDIS_URL
            JWT_SECRET
          )
          missing=()
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required GitHub environment variables or secrets: %s\n' "${missing[*]}"
            exit 1
          fi
          if [[ -z "${VPC_CONNECTOR:-}" ]]; then
            echo "VPC_CONNECTOR is empty. Memorystore private IPs need a Cloud Run VPC connector or another private egress setup."
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt

      - name: Run backend tests
        run: python -m pytest backend/tests

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Prepare deployment environment variables
        shell: bash
        run: |
          set -euo pipefail
          app_env_vars="^|^ENVIRONMENT=${ENVIRONMENT_NAME}|AUTO_CREATE_TABLES=false|DATABASE_URL=${DATABASE_URL}|REDIS_URL=${REDIS_URL}|CELERY_BROKER_URL=${CELERY_BROKER_URL}|CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}|JWT_SECRET=${JWT_SECRET}|CORS_ORIGINS=${CORS_ORIGINS}|DEFAULT_TIMEZONE=${DEFAULT_TIMEZONE}|WHATSAPP_DRY_RUN=${WHATSAPP_DRY_RUN}"
          if [[ -n "${ENCRYPTION_KEY:-}" ]]; then
            app_env_vars="${app_env_vars}|ENCRYPTION_KEY=${ENCRYPTION_KEY}"
          fi
          if [[ -n "${VAULT_MASTER_KEY:-}" ]]; then
            app_env_vars="${app_env_vars}|VAULT_MASTER_KEY=${VAULT_MASTER_KEY}"
          fi
          printf 'APP_ENV_VARS=%s\n' "$app_env_vars" >> "$GITHUB_ENV"

      - name: Build and push backend image
        shell: bash
        run: |
          set -euo pipefail
          image_uri="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REPOSITORY}/${BACKEND_IMAGE_NAME}:${GITHUB_SHA}"
          latest_uri="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REPOSITORY}/${BACKEND_IMAGE_NAME}:${ENVIRONMENT_NAME}-latest"
          docker build --file backend/Dockerfile --tag "$image_uri" --tag "$latest_uri" backend
          docker push "$image_uri"
          docker push "$latest_uri"
          printf 'IMAGE_URI=%s\n' "$image_uri" >> "$GITHUB_ENV"

      - name: Deploy Alembic migration job
        shell: bash
        run: |
          set -euo pipefail
          args=(
            run jobs deploy "$CLOUD_RUN_MIGRATION_JOB"
            "--project=$GCP_PROJECT_ID"
            "--region=$GCP_REGION"
            "--image=$IMAGE_URI"
            "--service-account=$CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT"
            "--set-cloudsql-instances=$CLOUD_SQL_CONNECTION_NAME"
            "--set-env-vars=$APP_ENV_VARS"
            "--command=alembic"
            "--args=-c,alembic.ini,upgrade,head"
            "--tasks=1"
            "--max-retries=0"
            "--task-timeout=900s"
            "--quiet"
          )
          if [[ -n "${VPC_CONNECTOR:-}" ]]; then
            args+=("--vpc-connector=$VPC_CONNECTOR" "--vpc-egress=$VPC_EGRESS")
          fi
          gcloud "${args[@]}"

      - name: Run Alembic migrations
        run: gcloud run jobs execute "$CLOUD_RUN_MIGRATION_JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --wait

      - name: Deploy backend service
        shell: bash
        run: |
          set -euo pipefail
          args=(
            run deploy "$CLOUD_RUN_SERVICE"
            "--project=$GCP_PROJECT_ID"
            "--region=$GCP_REGION"
            "--image=$IMAGE_URI"
            "--service-account=$CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT"
            "--set-cloudsql-instances=$CLOUD_SQL_CONNECTION_NAME"
            "--set-env-vars=$APP_ENV_VARS"
            "--allow-unauthenticated"
            "--quiet"
          )
          if [[ -n "${VPC_CONNECTOR:-}" ]]; then
            args+=("--vpc-connector=$VPC_CONNECTOR" "--vpc-egress=$VPC_EGRESS")
          fi
          gcloud "${args[@]}"

      - name: Smoke test health endpoint
        shell: bash
        run: |
          set -euo pipefail
          service_url="$(gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format='value(status.url)')"
          echo "Service URL: $service_url"
          for attempt in {1..12}; do
            if curl --fail --silent --show-error "$service_url/health"; then
              exit 0
            fi
            echo "Health check attempt ${attempt} failed; retrying..."
            sleep 5
          done
          exit 1
